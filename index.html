             <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.remove }}\" aria-label=\"Delete task\" style=\"font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- backlog -->\n        <sc-if value=\"{{ hasBacklog }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n            <h4 style=\"margin:0\">Backlog<\u002Fh4>\n            <span class=\"tag tag-accent-2\" style=\"margin-left:auto\">{{ backlogCount }} carried<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-3)\">{{ backlogImpact }}<\u002Fp>\n          <sc-for list=\"{{ backlog }}\" as=\"bk\" hint-placeholder-count=\"3\">\n            <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n              <div style=\"display:flex;justify-content:space-between;gap:var(--space-2);align-items:baseline\">\n                <span style=\"font-size:15px;line-height:1.3\">{{ bk.title }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px;white-space:nowrap\">{{ bk.minutes }} min<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"text-muted\" style=\"font-size:12px;margin-top:3px\">since {{ bk.from }}{{ bk.reasonText }}<\u002Fdiv>\n              <div class=\"backlog-actions\" style=\"display:flex;gap:var(--space-2);margin-top:var(--space-2);align-items:center\">\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ bk.toToday }}\" style=\"font-size:12px;padding:6px 12px\">Do today<\u002Fbutton>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ bk.toWeekend }}\" style=\"font-size:12px;padding:6px 12px\">Weekend<\u002Fbutton>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ bk.drop }}\" style=\"font-size:12px;margin-left:auto\">Drop<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ canReview }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ openReview }}\" style=\"margin-top:var(--space-6)\">Review the day<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ PLAN (month / week) ════════════════ -->\n      <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Plan<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4)\">{{ planIntro }}<\u002Fp>\n\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-4)\">\n          <sc-for list=\"{{ scopeTabs }}\" as=\"st\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ st.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ st.border }};border-radius:var(--radius-md);background:{{ st.bg }};color:{{ st.fg }};font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;transition:background .15s\">{{ st.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n          <h4 style=\"margin:0\">{{ planLabel }} targets<\u002Fh4>\n          <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto\">{{ planSummary }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noPlan }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:var(--space-4)\">\n            <sc-if value=\"{{ planNotDay }}\" hint-placeholder-val=\"{{ true }}\">\n              <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">Nothing here yet. Add a {{ planLabel }} target, then break it into {{ planChildLabel }} pieces.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ planIsDay }}\" hint-placeholder-val=\"{{ false }}\">\n              <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">No day tasks yet. Break a weekly target down, or add a single day's task here — it lands on the date you give it and shows up in Today.<\u002Fp>\n            <\u002Fsc-if>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ addPlan }}\" style=\"margin:0\">{{ addPlanLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-2) 0 0;font-style:italic\">Press and hold to reorder.<\u002Fp>\n        <sc-for list=\"{{ planRows }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div data-id=\"{{ t.id }}\" data-list=\"{{ t.list }}\" data-drag=\"{{ t.drag }}\" style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider);touch-action:pan-y\">\n            <div style=\"display:flex;gap:var(--space-3)\">\n              <button class=\"tap\" sc-camel-on-click=\"{{ t.toggle }}\" aria-label=\"Toggle done\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid {{ t.dotBorder }};background:{{ t.dotBg }};color:var(--color-bg);cursor:pointer;display:grid;place-items:center;padding:0;animation:{{ t.anim }}\">\n                <span style=\"font-size:12px;line-height:1;opacity:{{ t.checkOpacity }}\">✓<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:16px;line-height:1.3;opacity:{{ t.textOpacity }};text-decoration:{{ t.strike }}\">{{ t.title }}<\u002Fdiv>\n                <sc-if value=\"{{ t.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ t.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:var(--space-2);align-items:baseline;margin-top:4px;flex-wrap:wrap\">\n                  <span class=\"text-muted\" style=\"font-size:12px\">{{ t.meta }}<\u002Fspan>\n                  <sc-if value=\"{{ t.hasDue }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-family:var(--font-heading);font-weight:700;font-size:11px;color:{{ t.dueColor }}\">{{ t.due }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ t.hasKids }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ t.toggleOpen }}\" style=\"margin-top:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--color-accent);font-family:var(--font-heading);font-weight:700;font-size:12px\">{{ t.caret }} {{ t.kidSummary }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.remove }}\" aria-label=\"Delete\" style=\"flex:none;font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ t.children }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:var(--space-2);align-items:flex-start;padding:7px 0 7px var(--space-6);opacity:{{ c.opacity }}\">\n                <button class=\"tap\" sc-camel-on-click=\"{{ c.toggle }}\" aria-label=\"Toggle done\" style=\"flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;border:0;background:var(--color-accent-400);padding:0;cursor:pointer\"><\u002Fbutton>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14px;line-height:1.35;text-decoration:{{ c.strike }}\">{{ c.title }}<\u002Fdiv>\n                  <sc-if value=\"{{ c.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px;line-height:1.35\">{{ c.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div class=\"text-muted\" style=\"font-size:11px;margin-top:2px\">{{ c.when }} · {{ c.minutes }} min<\u002Fdiv>\n                <\u002Fdiv>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.remove }}\" aria-label=\"Delete\" style=\"flex:none;font-size:11px;color:var(--color-accent-2-800)\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ t.canBreak }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ t.breakDown }}\" style=\"margin-top:var(--space-2);font-size:12px;padding:6px 12px\">{{ t.breakLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ hasPlan }}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ addPlan }}\" style=\"margin-top:var(--space-6)\">{{ addAnotherLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ GOALS ════════════════ -->\n      <sc-if value=\"{{ isGoals }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Goals<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4)\">The long horizon. Tag tasks to a goal and its progress fills in.<\u002Fp>\n\n        <sc-if value=\"{{ noGoals }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:15px;font-style:italic;margin:var(--space-6) 0\">No goals yet.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div class=\"reveal\" style=\"margin-top:var(--space-6);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)\">\n              <h3 style=\"margin:0\">{{ g.title }}<\u002Fh3>\n              <span class=\"tag {{ g.tag }}\">{{ g.deadline }}<\u002Fspan>\n            <\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:5px 0 var(--space-3)\">{{ g.summary }}<\u002Fp>\n            <div style=\"height:3px;background:var(--color-neutral-200)\">\n              <div style=\"height:100%;width:{{ g.pct }}%;background:{{ g.barColor }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.remove }}\" style=\"margin-top:var(--space-2);font-size:12px;color:var(--color-accent-2-800);padding-inline:0\">Remove goal<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addGoal }}\" style=\"margin-top:var(--space-6)\">New goal<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ REVISE ════════════════ -->\n      <sc-if value=\"{{ isRevise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Revision<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 0\">{{ dueCount }} due now across {{ cardCount }} cards<\u002Fp>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-6);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n          <div style=\"flex:1;min-width:0\">\n            <h4 style=\"margin:0 0 2px\">Recall popups<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:0\">{{ revStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleRevision }}\" aria-label=\"Toggle revision mode\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ revSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ revKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Topic groups<\u002Fh6>\n        <sc-if value=\"{{ noGroups }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">No topic groups yet. Make one, then attach formula images under it — each image gets its own heading.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div class=\"reveal\" style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n              <button sc-camel-on-click=\"{{ g.toggleOpen }}\" style=\"flex:1;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--color-text);font-family:var(--font-heading)\">\n                <span style=\"font-weight:700;font-size:17px\">{{ g.caret }} {{ g.name }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"display:block;font-size:12px;margin-top:2px;font-family:var(--font-body)\">{{ g.countText }}<\u002Fspan>\n              <\u002Fbutton>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.revise }}\" style=\"flex:none;font-size:12px\">Revise all<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ g.cards }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) 0 var(--space-3) var(--space-4)\">\n                <div style=\"width:52px;height:52px;flex:none;background:var(--color-surface);display:grid;place-items:center;overflow:hidden\">\n                  <sc-if value=\"{{ c.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div role=\"img\" aria-label=\"Formula\" style=\"width:52px;height:52px;background-size:cover;background-position:center;background-image:{{ c.imgCss }}\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                    <label style=\"width:52px;height:52px;display:grid;place-items:center;cursor:pointer;background:repeating-linear-gradient(45deg,var(--color-neutral-200) 0 4px,var(--color-surface) 4px 8px)\" title=\"Add an image\">\n                      <span style=\"font-family:var(--font-heading);font-weight:700;font-size:9px;letter-spacing:.08em;color:var(--color-neutral-700);text-align:center\">ADD<\u002Fspan>\n                      <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ c.onPick }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;line-height:1.2\">{{ c.heading }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin:2px 0 6px\">{{ c.dueText }}<\u002Fdiv>\n                  <div style=\"height:3px;background:var(--color-neutral-200)\">\n                    <div style=\"height:100%;width:{{ c.strength }}%;background:{{ c.barColor }};transition:width .4s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end\">\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.open }}\" style=\"font-size:12px\">Revise<\u002Fbutton>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.remove }}\" aria-label=\"Delete card\" style=\"font-size:11px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;gap:var(--space-2);padding-left:var(--space-4);margin-top:var(--space-2)\">\n                <label class=\"btn btn-secondary\" style=\"font-size:12px;padding:8px 12px;cursor:pointer;min-height:44px\">\n                  Add image\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ g.onPick }}\" style=\"display:none\">\n                <\u002Flabel>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.remove }}\" style=\"font-size:12px;color:var(--color-accent-2-800);margin-left:auto\">Delete group<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addGroup }}\" style=\"margin-top:var(--space-6)\">New topic group<\u002Fbutton>\n        <p class=\"text-muted\" style=\"font-size:12px;margin-top:var(--space-3)\">Intervals stretch 1, 3, 7, 21, 45 days as you get a card right. \"Revise all\" walks a whole group in one pass.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ DAILY ROUTINE ════════════════ -->\n      <sc-if value=\"{{ isRoutines }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Daily routine<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4);line-height:1.45\">The things that repeat — badminton, gym, cooking. They appear on Today by themselves on the days you pick, and they never carry over: a routine is a rhythm, not a debt.<\u002Fp>\n\n        <sc-if value=\"{{ noRoutines }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n            <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-4) 0;line-height:1.45\">Nothing set yet.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ routineRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div class=\"reveal\" style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;line-height:1.25\">{{ r.title }}<\u002Fdiv>\n                <sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ r.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ r.blockLabel }} · {{ r.minutes }} min · {{ r.daysText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.edit }}\" style=\"flex:none;font-size:12px\">Edit<\u002Fbutton>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.remove }}\" aria-label=\"Delete routine\" style=\"flex:none;font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ addRoutine }}\" style=\"margin-top:var(--space-6)\">Add a routine<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ goToday }}\" style=\"font-size:13px\">Back to today<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ SETTINGS ════════════════ -->\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Settings<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-6)\">Tune the app to your week.<\u002Fp>\n\n        <h6 style=\"margin:0 0 var(--space-2)\">Your available time<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">Set the hours you actually have in each session. The capacity the app checks against is the span between them.<\u002Fp>\n        <sc-for list=\"{{ hourRows }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n              <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px\">{{ h.label }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--color-accent-700)\">{{ h.capacityText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-2);align-items:center\">\n              <input class=\"input\" type=\"time\" value=\"{{ h.from }}\" sc-camel-on-change=\"{{ h.setFrom }}\" aria-label=\"Start time\" style=\"flex:1\">\n              <span class=\"text-muted\" style=\"font-size:13px\">to<\u002Fspan>\n              <input class=\"input\" type=\"time\" value=\"{{ h.to }}\" sc-camel-on-change=\"{{ h.setTo }}\" aria-label=\"End time\" style=\"flex:1\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Office days<\u002Fh6>\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-8)\">\n          <sc-for list=\"{{ officeDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.toggle }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ d.border }};border-radius:var(--radius-md);background:{{ d.bg }};color:{{ d.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:0 0 var(--space-3)\">Notifications<\u002Fh6>\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:15px\">Scheduled alerts<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0\">{{ notifStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleNotify }}\" aria-label=\"Toggle notifications\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ notifSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ notifKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:var(--space-3)\"><label>Morning reminder<\u002Flabel><input class=\"input\" type=\"time\" value=\"{{ reminderTime }}\" sc-camel-on-change=\"{{ setReminder }}\"><\u002Fdiv>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ testNotify }}\">Send a test notification<\u002Fbutton>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Recall frequency<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">{{ freqSummary }}<\u002Fp>\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-3)\">\n          <sc-for list=\"{{ freqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ f.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ f.border }};border-radius:var(--radius-md);background:{{ f.bg }};color:{{ f.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-3)\">\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Or every … minutes<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"5\" max=\"720\" step=\"5\" value=\"{{ freqMin }}\" sc-camel-on-change=\"{{ setFreqField }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>At most, per day<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"1\" max=\"50\" step=\"1\" value=\"{{ dailyCap }}\" sc-camel-on-change=\"{{ setCap }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-8)\">\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Only from<\u002Flabel>\n            <input class=\"input\" type=\"time\" value=\"{{ recallFrom }}\" sc-camel-on-change=\"{{ setRecallFrom }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Until<\u002Flabel>\n            <input class=\"input\" type=\"time\" value=\"{{ recallTo }} esh<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Data<\u002Fh6>\n        <sc-if value=\"{{ confirmErase }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:var(--space-3);border:1px solid var(--color-accent-2);border-radius:var(--radius-md)\">\n            <p style=\"font-size:14px;margin:0 0 var(--space-3);line-height:1.4\">Erase every task, goal, card and image, here and in your account. This cannot be undone.<\u002Fp>\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cancelErase }}\" style=\"flex:1\">Cancel<\u002Fbutton>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ eraseAll }}\" style=\"flex:1;background:var(--color-accent-2)\">Erase<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ confirmErase }}\" hint-placeholder-val=\"{{ false }}\"><\u002Fsc-if>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ askErase }}\" style=\"margin-top:var(--space-2)\">Erase everything<\u002Fbutton>\n\n        <div style=\"margin-top:var(--space-8);padding-top:var(--space-6);border-top:2px solid var(--color-text);display:flex;align-items:center;gap:var(--space-4)\">\n          <img src=\"b71834bd-0c2a-4b2e-8f8b-d165c0602e05\" alt=\"ClimbUp\" style=\"width:56px;height:56px;object-fit:contain;flex:none\">\n          <div>\n            <h4 style=\"margin:0\">ClimbUp<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:3px 0 0;font-style:italic\">Task, Study, Steady growth.<\u002Fp>\n            <p class=\"text-muted\" style=\"font-size:11px;margin:6px 0 0;letter-spacing:.04em\">Version 2.0 · build {{ buildStamp }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:var(--space-6);display:flex;align-items:center;gap:var(--space-3)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:14px\">{{ authEmail }}<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0\">Signed in with Google · data syncs to your account<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ signOut }}\" style=\"flex:none\">Sign out<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- focus timer -->\n    <sc-if value=\"{{ timerOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"timer-bar\" style=\"position:absolute;bottom:84px;left:0;right:0;background:var(--color-text);color:var(--color-bg);padding:var(--space-2) var(--space-4);z-index:7;display:flex;align-items:center;gap:var(--space-3);animation:rise .3s ease\">\n        <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:21px;min-width:62px\">{{ timerClock }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ timerTitle }}<\u002Fdiv>\n          <div style=\"height:2px;background:color-mix(in srgb,var(--color-bg) 30%,transparent);margin-top:5px\">\n            <div style=\"height:100%;width:{{ timerPct }}%;background:var(--color-accent-300)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ timerPause }}\" style=\"flex:none;padding:6px 9px;border-radius:var(--radius-md);border:1px solid color-mix(in srgb,var(--color-bg) 45%,transparent);background:transparent;color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:12px;cursor:pointer\">{{ timerPauseLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ timerDone }}\" style=\"flex:none;padding:6px 9px;border-radius:var(--radius-md);border:none;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:12px;cursor:pointer\">Done<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- bottom nav -->\n    <div class=\"bottom-nav\" style=\"position:absolute;bottom:0;left:0;right:0;height:84px;background:var(--color-bg);display:flex;align-items:flex-start;justify-content:space-between;padding:var(--space-2) 4px 0;z-index:4\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ n.go }}\" style=\"flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ n.color }};padding:4px 0;font-family:var(--font-heading)\">\n          <span style=\"width:5px;height:5px;border-radius:var(--radius-sm);background:{{ n.dot }};transition:background .2s\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:{{ n.weight }}\">{{ n.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showAdd }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"fab-add\" sc-camel-on-click=\"{{ goAdd }}\" aria-label=\"Add a task\" style=\"position:absolute;bottom:58px;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-bg);border:3px solid var(--color-bg);box-shadow:var(--shadow-md);cursor:pointer;display:grid;place-items:center;z-index:6\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:26px;line-height:1;margin-top:-2px\">+<\u002Fspan><\u002Fbutton>\n    <\u002Fsc-if>\n\n    <!-- recall popup -->\n    <sc-if value=\"{{ recallOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:var(--space-4);background:color-mix(in srgb,var(--color-neutral-900) 55%,transparent);animation:fadeBg .25s ease\">\n        <div class=\"recall-card scr\" style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:popIn .3s ease\">\n          <sc-if value=\"{{ isPrompt }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">Active recall<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">{{ recallTopic }}<\u002Fh3>\n              <span class=\"tag tag-accent\">{{ recallSubject }}<\u002Fspan>\n              <p style=\"font-size:17px;font-style:italic;margin:var(--space-4) 0 var(--space-2);line-height:1.4\">Can you recall the formula or concept?<\u002Fp>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-6)\">Say it in your head first, then check yourself.<\u002Fp>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reveal }}\">Open<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ recallDismiss }}\" style=\"font-size:13px\">Later<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isReveal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:rise .25s ease\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2);margin-bottom:var(--space-3)\">\n                <div>\n                  <h6 style=\"margin:0 0 3px;color:var(--color-accent-700)\">{{ recallSubject }}<\u002Fh6>\n                  <h4 style=\"margin:0\">{{ recallTopic }}<\u002Fh4>\n                <\u002Fdiv>\n                <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ recallDismiss }}\" aria-label=\"Close\" style=\"flex:none\"><span style=\"font-size:18px;line-height:1\">×<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-surface);display:grid;place-items:center;min-height:160px;margin-bottom:var(--space-3)\">\n                <sc-if value=\"{{ recallHasImg }} uto;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:rise .3s ease\">\n          <sc-if value=\"{{ reviewStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">End of day · twenty seconds<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">What slipped, and why?<\u002Fh3>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-6)\">The reason matters more than the miss. It is what shows you the pattern.<\u002Fp>\n              <sc-if value=\"{{ nothingSlipped }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:16px;font-style:italic;margin:0 0 var(--space-4)\">Everything is done. A clean day, nothing to carry.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ slipped }}\" as=\"sl\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:var(--space-4)\">\n                  <div style=\"font-size:15px;line-height:1.3;margin-bottom:var(--space-2)\">{{ sl.title }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ sl.options }}\" as=\"op\" hint-placeholder-count=\"4\">\n                      <button class=\"reason-chip\" sc-camel-on-click=\"{{ op.pick }}\" style=\"padding:6px 11px;border-radius:var(--radius-md);border:1px solid {{ op.border }};background:{{ op.bg }};color:{{ op.fg }};font-size:12px;font-family:var(--font-heading);font-weight:600;cursor:pointer;transition:background .15s\">{{ op.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reviewNext }}\" style=\"margin-top:var(--space-4)\">Continue<\u002Fbutton  sc-camel-on-input=\"{{ setGroupName }}\" placeholder=\"Computer networks\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveGroup }}\">Create<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeGroupForm }}\" style=\"font-size:13px\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- image cropper -->\n    <sc-if value=\"{{ cropOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:24;background:var(--color-bg);display:flex;flex-direction:column;animation:fadeBg .2s ease\">\n        <div style=\"flex:none;padding:calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) var(--space-3)\">\n          <h4 style=\"margin:0\">Crop the image<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:4px 0 0;line-height:1.4\">Drag to move, pinch to zoom. Only what is inside the square is saved.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:grid;place-items:center;padding:0 var(--space-4)\">\n          <div ref=\"{{ cropBox }}\" data-crop-frame=\"1\" style=\"width:100%;aspect-ratio:1/1;max-height:100%;position:relative;overflow:hidden;background:var(--color-neutral-200);touch-action:none;cursor:grab;outline:2px solid var(--color-accent);outline-offset:-1px\">\n            <img alt=\"\" data-crop-img=\"1\" draggable=\"false\" style=\"{{ cropImgStyle }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom))\">\n          <sc-if value=\"{{ cropNeedsHeading }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\" style=\"margin-bottom:var(--space-3)\">\n              <label>Heading for this image<\u002Flabel>\n              <input class=\"input\" value=\"{{ cropHeading }}\" sc-camel-on-input=\"{{ setCropHeading }}\" placeholder=\"Bayes' theorem\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cancelCrop }}\" style=\"flex:1\">Cancel<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveCrop }}\" style=\"flex:1\">Save image<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- how to install, when the browser will not do it on our say-so -->\n    <sc-if value=\"{{ installHelpOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:26;background:rgba(0,0,0,.45);display:grid;place-items:end center;animation:fadeBg .2s ease\">\n        <div style=\"width:100%;background:var(--color-bg);border-top:2px solid var(--color-text);border-radius:var(--radius-md) var(--radius-md) 0 0;padding:var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 var(--space-2)\">{{ installHelpTitle }}<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4);line-height:1.45\">{{ installHelpWhy }}<\u002Fp>\n          <sc-for list=\"{{ installHelpSteps }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-bottom:1px solid var(--color-divider)\">\n              <span style=\"flex:none;font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--color-accent)\">{{ st.n }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.4\">{{ st.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-3) 0 0;line-height:1.4;font-style:italic\">{{ installDiag }}<\u002Fp>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ closeInstallHelp }}\" style=\"margin-top:var(--space-3)\">Got it<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- back pressed on the dashboard: the next one leaves -->\n    <sc-if value=\"{{ confirmExit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:26;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:var(--space-6);animation:fadeBg .2s ease\">\n        <div style=\"width:100%;max-width:320px;background:var(--color-bg);border:2px solid var(--color-text);border-radius:var(--radius-md);padding:var(--space-5) var(--space-4);box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 var(--space-2)\">Leave ClimbUp?<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4);line-height:1.45\">You are on the home screen, so going back again closes the app. Your work is saved to your account either way.<\u002Fp>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stayHere }}\" style=\"flex:1\">Stay<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ leaveApp }}\" style=\"flex:1\">Leave<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"toast\" style=\"position:absolute;bottom:96px;left:var(--space-4);right:var(--space-4);background:var(--color-text);color:var(--color-bg);padding:10px var(--space-3);border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow-md);z-index:22;animation:rise .3s ease;text-align:center\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:920}}\">\nconst REASONS=['Too tired','No time','Too hard','Just skipped'];\nconst INTERVALS=[1,3,7,21,45];\nconst DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n\n/* The day's three sessions. \"Busy Hours\" is the middle one — set it to your\n   own in Settings; the app does not assume what fills it. The keys are what\n   stored tasks and hours are filed under, so they stay put when a label\n   changes. */\nconst BLOCKS=[\n  {key:'morning', label:'Morning'},\n  {key:'noon',    label:'Busy Hours'},\n  {key:'evening', label:'Evening'},\n];\n\n/* One task model at three scopes instead of two parallel hierarchies. A month\n   task breaks into week tasks, a week task into day tasks, each child pointing\n   at its parent — so \"monthly targets broken into weekly, broken into daily\"\n   and \"weekly and monthly tasks I can organise\" are the same list viewed at a\n   different zoom, and one drag implementation orders all three. */\nconst SCOPES=[\n  {key:'month', label:'Month', child:'week',  childLabel:'weekly'},\n  {key:'week',  label:'Week',  child:'day',   childLabel:'daily'},\n  {key:'day',   label:'Day',   child:null,    childLabel:null},\n];\n\n/* Bump when the shape of persisted state changes. loadCloud discards anything\n   stored under a different version rather than migrating it — which is also\n   what clears the old demo seed out of accounts that already saved it. */\nconst SCHEMA=4;\n/* A stamp you can read off the screen. Its whole job is answering \"is the\n   thing in my hand the thing that was deployed?\" — bump it with each build. */\nconst BUILD='2026-07-26.5';\n\n/* Installing is the browser's call, not ours: without a captured\n   `beforeinstallprompt` no script can put an app on a home screen. What we can\n   do is name the right menu item. The distinction matters — Chrome's \"Add to\n   Home screen\" *shortcut* and Safari's Add to Home Screen from a non-Safari\n   browser both drop a bookmark that opens in a browser tab, which is exactly\n   what an install is meant to avoid. */\nconst INSTALL_HELP={\n  ios:{\n    title:'Add ClimbUp to your Home Screen',\n    why:'Safari does not let a page install itself, so this is two taps in the Share menu. Afterwards it opens full screen, with no browser bar.',\n    steps:['Tap the Share button — the square with the arrow out of it.',\n           'Scroll down and tap \"Add to Home Screen\".',\n           'Tap Add. Open ClimbUp from the new icon, not from Safari.'],\n  },\n  iosOther:{\n    title:'Open this in Safari first',\n    why:'On iPhone only Safari can install a web app. Adding it from Chrome or another browser saves a bookmark that reopens in a browser tab.',\n    steps:['Copy this page’s link.',\n           'Open Safari and paste it in.',\n           'Tap Share, then \"Add to Home Screen\".'],\n  },\n  android:{\n    title:'Install ClimbUp',\n    why:'Pick \"Install app\" in the browser menu. \"Add to Home screen\" makes a shortcut that reopens in a browser tab instead.',\n    steps:['Tap the ⋮ menu, top right of the browser.',\n           'Tap \"Install app\" — or \"Install ClimbUp\" if it is offered.',\n           'Confirm Install, then open it from the new icon.'],\n  },\n  desktop:{\n    title:'Install ClimbUp',\n    why:'Chrome and Edge show an install control in the address bar once a page qualifies. It has to be served over HTTPS for that to appear.',\n    steps:['Look for the install icon at the right of the address bar.',\n           'Or open the ⋮ menu and choose Install / Apps → Install this site.',\n           'It then opens in its own window rather than a tab.'],\n  },\n};\nconst PERSIST_KEYS=['schema','theme','office','hours','capacity','revisionOn','freqMin',\n  'notifyOn','reminderTime','streak','freezes','freezeMax','streakBest','dailyCap',\n  'recallFrom','recallTo',\n  'groups','cards','tasks','routines','backlog','history','goals','lastRoll'];\n\nconst mins=hhmm=>{ const p=String(hhmm||'0:0').split(':').map(Number); return (p[0]||0)*60+(p[1]||0); };\n/* \"every 25 minutes\", \"every 2 hours\", \"every 1 hour 30 minutes\" */\nconst freqWords=m=>{\n  const h=Math.floor(m/60), r=m%60;\n  const H=h?(h+(h===1?' hour':' hours')):'', R=r?(r+' minutes'):'';\n  return (H&&R)?(H+' '+R):(H||R||'0 minutes');\n};\nconst span=(from,to)=>Math.max(0, mins(to)-mins(from));\n\n/* ——— Real dates ———\n   `day` used to be a counter and there was no calendar at all, which made\n   every dated thing here impossible: a target date to aim at, a routine that\n   knows which weekday it is, work that rolls forward when a day actually ends,\n   a month grid with anything marked on it. Everything below is local-time and\n   ISO 'YYYY-MM-DD' keyed — never Date.toISOString(), which converts to UTC and\n   lands on the wrong day for anyone east or west of Greenwich. */\nconst iso=d=>{\n  const p=n=>String(n).padStart(2,'0');\n  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());\n};\nconst parseISO=s=>{ const p=String(s||'').split('-').map(Number);\n  return new Date(p[0]||1970, (p[1]||1)-1, p[2]||1); };\nconst todayISO=()=>iso(new Date());\nconst addDays=(s,n)=>{ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };\nconst daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);\n/* Monday-based, to match the DAYS strip. */\nconst dowIndex=s=>{ const d=parseISO(s).getDay(); return (d+6)%7; };\nconst startOfWeek=s=>addDays(s, -dowIndex(s));\nconst MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst prettyDate=s=>{ if(!s) return ''; const d=parseISO(s);\n  return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); };\n\n/* An empty week still needs its seven bars or the chart has nothing to draw. */\nconst emptyWeek=()=>DAYS.map(d=>({d, planned:0, done:0, office:d!=='Sat'&&d!=='Sun'}));\n\nconst DEFAULT_HOURS={\n  morning:{from:'06:30', to:'08:00'},\n  noon:   {from:'09:30', to:'18:00'},\n  evening:{from:'20:00', to:'22:30'},\n};\nconst capacityFrom=h=>{\n  const c={}; BLOCKS.forEach(b=>{ c[b.key]=span(h[b.key].from, h[b.key].to); }); return c;\n};\n\n/* The starting point for a new account, and what \"Erase everything\" restores. */\nconst freshState=()=>({\n  schema:SCHEMA,\n  office:{Mon:true,Tue:true,Wed:true,Thu:true,Fri:true,Sat:false,Sun:false},\n  hours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),\n  capacity:capacityFrom(DEFAULT_HOURS),\n  revisionOn:false, freqMin:30, recallsToday:0, dailyCap:8,\n  recallFrom:'09:00', recallTo:'21:00',   // the window recalls are welcome in\n  streak:0, freezes:2, freezeMax:2, streakBest:0,\n  groups:[], cards:[], tasks:[], routines:[], backlog:[], goals:[],\n  history:{},              // 'YYYY-MM-DD' -> {planned, done, total, finished}\n  lastRoll:todayISO(),     // the date unfinished work was last carried forward\n});\n\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.addForm = React.createRef();\n    this.cropBox = React.createRef();\n    this._pop = {};\n    this.state = {\n      screen:'dash', theme:'light', toast:null, now:new Date(),\n      planScope:'month',        // which zoom the Plan screen is showing\n      dayOffset:0,              // Today, shifted: 0 is today, +1 tomorrow\n      recall:null, recallStage:'prompt', recallQueue:null,\n      notifyOn:false, notifPerm:'default', reminderTime:'06:45',\n      timer:null, review:null,\n      expanded:{},              // task ids showing their breakdown\n      taskForm:null,            // the add/break-down sheet\n      routineForm:null,         // the daily-routine sheet\n      groupForm:null,           // the add-a-topic-group sheet\n      crop:null,                // the image cropper, when open\n      confirmErase:false, confirmExit:false,\n      installShow:false, installReady:false, installed:false, installHelp:null,\n      updateReady:false,\n      authState:'checking', authUser:null, authError:null,\n      ...freshState(),\n    };\n  }\n\n  componentDidMount(){\n    this._alive=true;\n    this._cloudReady=false;\n    if(window.__firebaseReady){\n      window.__firebaseReady.then(fb=>{\n        if(!this._alive) return;\n        fb.auth().onAuthStateChanged(user=>{\n          if(!this._alive) return;\n          if(user){\n            this._cloudReady=false;\n            this.setState({authState:'signedIn', authUser:{uid:user.uid, email:user.email}, authError:null});\n            this.loadCloud(user.uid);\n            this.armBack();\n            this.armUnloadWarning(true);\n            this.offerInstall();\n          }else{\n            this._cloudReady=false;\n            this.setState({authState:'signedOut', authUser:null});\n            this.armUnloadWarning(false);\n          }\n        });\n      }).catch(()=>{ if(this._alive) this.setState({authState:'signedOut'}); });\n    }else{\n      this.setState({authState:'signedOut'});\n    }\n    this.loadImages();\n    if(window.Notification) this.setState({notifPerm:Notification.permission});\n    this.syncThemeColor();\n    this.setupBack();\n    this.setupInstall();\n    this.dragSetup();\n    this.cropSetup();\n    this.rollForward();\n    this._tick=setInterval(()=>{\n      if(!this._alive) return;\n      // a render mid-drag would rebuild the rows out from under the gesture\n      if(this._dragging) return;\n      if(this.state.timer && this.state.timer.running){\n        this.setState(s=>{\n          const t=s.timer; if(!t||!t.running) return null;\n          return {timer:{...t, left:Math.max(0,t.left-1), spent:t.spent+1}};\n        });\n      }\n      const n=new Date();\n      if(n.getMinutes()!==this.state.now.getMinutes()){\n        this.setState({now:n});\n        this.checkReminder(n);\n        // a phone left open overnight has to wake up on the right day\n        if(iso(n)!==this.state.lastRoll) this.rollForward();\n      }\n    },1000);\n    this.schedule(12000);\n  }\n  componentWillUnmount(){ this._alive=false; clearInterval(this._tick); clearInterval(this._up);\n    clearTimeout(this._rt);\n    clearTimeout(this._t); clearTimeout(this._it); clearTimeout(this._saveT);\n    if(this._onPop) window.removeEventListener('popstate', this._onPop);\n    this.armUnloadWarning(false);\n    if(this._dragTeardown) this._dragTeardown(); }\n\n  syncThemeColor(){\n    this._themeApplied=this.state.theme;\n    const m=document.querySelector('meta[name=\"theme-color\"]');\n    if(m) m.setAttribute('content', this.state.theme==='dark'?'#1c1a19':'#f3f2f2');\n  }\n\n  /* The DC runtime calls this with (prevProps) ONLY — there is no prevState\n     second argument, so anything comparing against one reads properties off\n     undefined and throws. The runtime swallows that in a try/catch, which is\n     why the symptom was silent: the debounced save never armed and nothing\n     after the first load reached the database. Previous values are tracked\n     here instead, by reference, which is what the keys want since every writer\n     spreads a fresh object. */\n  componentDidUpdate(){\n    if(this._themeApplied!==this.state.theme) this.syncThemeColor();\n    const prev=this._persisted, now={};\n    for(const k of PERSIST_KEYS) now[k]=this.state[k];\n    this._persisted=now;\n    if(!prev || !this.state.authUser || !this._cloudReady) return;\n    if(PERSIST_KEYS.some(k=>prev[k]!==now[k])){\n      clearTimeout(this._saveT);\n      this._saveT=setTimeout(()=>this.saveCloud(), 900);\n    }\n  }\n\n  /* ——— Google sign-in + Realtime Database sync ——— */\n  /* Always re-resolve; see __firebaseApp in the document head for why holding\n     on to a namespace is what breaks. */\n  fb(){ return window.__firebaseApp ? window.__firebaseApp() : null; }\n\n  signIn(){\n    const f=this.fb();\n    if(!f){ this.setState({authError:'Still loading — try again in a moment'}); return; }\n    this.setState({authError:null});\n    f.auth().signInWithPopup(new f.auth.GoogleAuthProvider())\n      .catch(err=>{ if(this._alive) this.setState({authError: err.message||'Sign-in failed'}); });\n  }\n  signOut(){ const f=this.fb(); if(f) f.auth().signOut(); }\n\n  loadCloud(uid){\n    const f=this.fb();\n    if(!f){ this._cloudReady=true; return; }\n    f.database().ref('users/'+uid).once('value').then(snap=>{\n      if(!this._alive) return;\n      const data=snap.val();\n      if(data && data.schema===SCHEMA){\n        // Firebase stores no empty arrays or objects at all — it deletes the\n        // key — so anything the user has legitimately emptied comes back\n        // missing. Fill those from the fresh state or the app renders undefined.\n        const base=freshState(), merged={};\n        Object.keys(base).forEach(k=>{ merged[k]= (data[k]==null) ? base[k] : data[k]; });\n        PERSIST_KEYS.forEach(k=>{ if(data[k]!=null && merged[k]===undefined) merged[k]=data[k]; });\n        this.setState(merged, ()=>{ this.loadImages(); this.loadCloudImages(uid); this.rollForward(); });\n      }else if(data){\n        // A different schema, including the demo seed early accounts saved.\n        this.setState(freshState());\n      }\n      this._cloudReady=true;\n    }).catch(()=>{ this._cloudReady=true; });\n  }\n  saveCloud(){\n    if(!this.state.authUser) return;\n    const s=this.state, payload={};\n    PERSIST_KEYS.forEach(k=>{ payload[k]=s[k]===undefined?null:s[k]; });\n    // Cropped images are megabytes of base64 and belong nowhere near the\n    // debounced whole-state payload; they are written one at a time to\n    // users/<uid>/cardImages instead, by storeImage.\n    payload.cards=(s.cards||[]).map(c=>{ const {img, ...rest}=c; return rest; });\n    const f=this.fb();\n    if(!f) return;\n    // update(), not set(): set() replaces the whole user node and would delete\n    // the cardImages sibling on every save, which is what made an added image\n    // vanish the next time the app was opened.\n    f.database().ref('users/'+this.state.authUser.uid).update(payload).catch(()=>{});\n  }\n\n  /* ——— card images ———\n     Keyed by card id, cached in localStorage for an instant first paint and\n     mirrored to users/<uid>/cardImages so they survive a cleared cache and\n     follow the account to another device. */\n  imagesRef(){\n    const f=this.fb(), u=this.state.authUser;\n    return (f && u) ? f.database().ref('users/'+u.uid+'/cardImages') : null;\n  }\n  readCache(){\n    try{ return JSON.parse(localStorage.getItem('sp.cardImages')||'{}'); }catch(e){ return {}; }\n  }\n  writeCache(map){\n    try{ localStorage.setItem('sp.cardImages', JSON.stringify(map)); return true; }\n    catch(e){ return false; }\n  }\n  loadImages(){\n    const saved=this.readCache();\n    if(!Object.keys(saved).length) return;\n    this.setState(st=>({cards:st.cards.map(c=>saved[c.id]?{...c, img:saved[c.id]}:c)}));\n  }\n  /* Runs once per sign-in, after the cards are in state. The account copy wins\n     over the device cache, and anything this device holds that the account does\n     not is lifted up — that is the migration path for images added before\n     images were synced at all. */\n  loadCloudImages(uid){\n    const f=this.fb();\n    if(!f) return;\n    f.database().ref('users/'+uid+'/cardImages').once('value').then(snap=>{\n      if(!this._alive) return;\n      const cloud=snap.val()||{}, local=this.readCache(), merged={...local, ...cloud};\n      this.writeCache(merged);\n      if(Object.keys(merged).length)\n        this.setState(st=>({cards:st.cards.map(c=>merged[c.id]?{...c, img:merged[c.id]}:c)}));\n      const lift={};\n      (this.state.cards||[]).forEach(c=>{ if(local[c.id] && !cloud[c.id]) lift[c.id]=local[c.id]; });\n      if(Object.keys(lift).length)\n        f.database().ref('users/'+uid+'/cardImages').update(lift).catch(()=>{});\n    }).catch(()=>{});\n  }\n  storeImage(id, dataUrl){\n    const saved=this.readCache();\n    if(dataUrl) saved[id]=dataUrl; else delete saved[id];\n    const cached=this.writeCache(saved);\n    const ref=this.imagesRef();\n    if(!ref){\n      if(!cached) this.toast('Could not save the image — storage is full');\n      return;\n    }\n    const w = dataUrl ? ref.child(id).set(dataUrl) : ref.child(id).remove();\n    w.catch(()=>{ if(this._alive && dataUrl) this.toast('Could not save the image to your account'); });\n  }\n\n  eraseAll(){\n    // before the state reset, while authUser is still readable\n    const ref=this.imagesRef();\n    if(ref) ref.remove().catch(()=>{});\n    this.setState({...freshState(), expanded:{}, taskForm:null, groupForm:null, crop:null,\n      routineForm:null, recall:null, timer:null, review:null, confirmErase:false, screen:'dash'});\n    try{ localStorage.removeItem('sp.cardImages'); }catch(e){}\n    this.toast('Everything erased. Fresh start.');\n  }\n\n  /* ——— install to home screen ——— */\n  setupInstall(){\n    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;\n    if(standalone || window.navigator.standalone===true){ this.setState({installed:true}); return; }\n    window.addEventListener('beforeinstallprompt', e=>{\n      e.preventDefault(); this._deferred=e;\n      if(this._alive) this.setState({installReady:true});\n    });\n    window.addEventListener('appinstalled', ()=>{\n      if(this._alive) this.setState({installed:true, installShow:false});\n    });\n    if('serviceWorker' in navigator && window.top===window && location.protocol.indexOf('http')===0){\n      navigator.serviceWorker.register('sw.js').then(reg=>this.watchForUpdate(reg)).catch(()=>{});\n    }\n  }\n\n  /* ——— staying current ———\n     A cache-first worker can pin a device to an old build with no way out from\n     inside the app. The worker is network-first for the page now, and this is\n     the other half: notice a new worker, take it without waiting for every tab\n     to close, and reload once when it takes over. */\n  watchForUpdate(reg){\n    if(!reg) s installs at all, and — for\n     Chrome — an offer it has already made to us. */\n  installDiag(){\n    const ua=navigator.userAgent||'';\n    const secure = location.protocol==='https:' || location.hostname==='localhost';\n    if(!secure) return 'This page is on '+location.protocol+' — installing needs HTTPS, so no browser will offer it here.';\n    if(/FBAN|FBAV|Instagram|Line\\/|WhatsApp|Snapchat|Twitter/i.test(ua))\n      return 'You are in an app’s built-in browser, which cannot install. Open this link in Chrome or Safari first.';\n    if(this.state.installed) return 'Already installed — you are looking at the installed app.';\n    if(this.state.installReady) return 'Your browser has offered an install; the Install button will take it.';\n    return 'Your browser has not offered an install yet. The steps above do it by hand.';\n  }\n\n  /* ——— Long-press to drag a row into place ———\n     Delegated from the document so it survives every re-render without\n     per-row refs: rows carry data-list (which ordered list they belong to)\n     and data-id, and only rows marked data-drag=\"1\" take part. One\n     implementation therefore orders the day's blocks, the weekly list and\n     the monthly list alike.\n\n     Nothing here calls setState until the finger lifts. A render mid-gesture\n     would rebuild the rows and strip the transforms this is driving, so the\n     drag runs on direct style writes — which also keeps it at pointer speed\n     rather than one React pass per frame — and _dragging tells the clock and\n     recall timers to hold still until it is over. */\n  dragSetup(){\n    const LONG_PRESS=380, SLOP=10, EDGE=64;\n    let press=null, drag=null, raf=0, edge=0;\n\n    const rowsIn=list=>Array.from(\n      document.querySelectorAll('[data-drag=\"1\"][data-list=\"'+list+'\"]'));\n    const clearPress=()=>{ if(press&&press.timer) clearTimeout(press.timer); press=null; };\n\n    const place=y=>{\n      const dy=y-drag.startY;\n      drag.row.style.transform='translateY('+dy+'px) scale(1.03)';\n      const to=Math.max(0, Math.min(drag.rows.length-1,\n        drag.from+Math.round(dy/Math.max(1,drag.height))));\n      if(to===drag.to) return;\n      drag.to=to;\n      drag.rows.forEach((r,i)=>{\n        if(r===drag.row) return;\n        const shift = (drag.from<to && i>drag.from && i<=to) ? -drag.height\n                    : (drag.from>to && i>=to && i<drag.from) ?  drag.height : 0;\n        r.style.transform='translateY('+shift+'px)';\n      });\n    };\n    const autoScroll=()=>{\n      raf=0;\n      if(!drag||!edge) return;\n      const sc=document.querySelector('.scr');\n      if(sc){ sc.scrollTop+=edge; drag.startY-=edge; place(drag.lastY); }\n      raf=requestAnimationFrame(autoScroll);\n    };\n\n    const begin=()=>{\n      const rows=rowsIn(press.list);\n      const row=rows.filter(r=>r.dataset.id===String(press.id))[0];\n      if(!row){ clearPress(); return; }\n      const i=rows.indexOf(row);\n      drag={row, rows, list:press.list, from:i, to:i, lastY:press.y,\n        ids:rows.map(r=>r.dataset.id),\n        height:row.getBoundingClientRect().height, startY:press.y};\n      this._dragging=true;\n      rows.forEach(r=>{\n        r.style.willChange='transform';\n        r.style.transition = r===row ? 'none' : 'transform .18s cubic-bezier(.2,.7,.3,1)';\n      });\n      row.style.position='relative'; row.style.zIndex='3';\n      row.style.background='var(--color-bg)';\n      row.style.boxShadow='var(--shadow-md)';\n      row.style.transform='scale(1.03)';\n      document.body.style.userSelect='none';\n      if(navigator.vibrate) navigator.vibrate(12);\n    };\n\n    const onDown=e=>{\n      if(drag) return;\n      if(e.pointerType==='mouse' && e.button!==0) return;\n      if(!e.target.closest) return;\n      if(e.target.closest('button')) return;   // the tick, Focus and delete are taps\n      const row=e.target.closest('[data-drag=\"1\"]');\n      if(!row) return;\n      press={id:row.dataset.id, list:ro , onDown, true);\n      document.removeEventListener('pointermove', onMove, true);\n      document.removeEventListener('pointerup', finish, true);\n      document.removeEventListener('pointercancel', finish, true);\n    };\n  }\n  /* ids arrive in their new visual order; they share one list by construction */\n  reorder(ids){\n    this.setState(st=>({tasks:st.tasks.map(t=>{\n      const i=ids.indexOf(String(t.id));\n      return i>-1 ? {...t, order:i+1} : t;\n    })}));\n  }\n\n  /* ——— the day turning over ———\n     Unfinished dated work moves to today rather than being stranded on a date\n     that has passed; it is marked carried so the row can say so. Routines are\n     deliberately NOT carried — a routine is \"every Tuesday\", not a debt, and\n     yesterday's missed gym session is not owed today.\n\n     Runs on mount and again whenever the clock crosses midnight while the app\n     is open, so a phone left on the Today screen overnight wakes up correct. */\n  rollForward(){\n    const now=todayISO();\n    if(this.state.lastRoll===now) return;\n    this.setState(st=>{\n      const history={...st.history};\n      // close the books on every past day that still has work on it\n      const stale=st.tasks.filter(t=>t.scope==='day' && t.date && t.date<now);\n      const dates={}; stale.forEach(t=>{ dates[t.date]=true; });\n      Object.keys(dates).forEach(d=>{\n        const on=st.tasks.filter(t=>t.scope==='day' && t.date===d);\n        history[d]={\n          planned:on.reduce((a,t)=>a+t.minutes,0),\n          done:on.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0),\n          total:on.length, finished:on.filter(t=>t.done).length,\n        };\n      });\n      const tasks=st.tasks.map(t=>{\n        if(t.scope!=='day' || !t.date || t.date>=now) return t;\n        if(t.done) return t;\n        if(t.type==='event') return t;   // an appointment that has passed has passed\n        return {...t, date:now, carried:true};\n      // a finished or expired dated task stays on its own date for the record\n      }).filter(t=>!(t.scope==='day' && t.type==='event' && t.date && t.date<now));\n      return {tasks, history, lastRoll:now, recallsToday:0};\n    });\n  }\n\n  /* ——— daily routine ———\n     Kept apart from tasks on purpose: routines repeat by weekday, never carry,\n     and are ticked per date rather than once. */\n  openRoutineForm(id){\n    const r=id? this.state.routines.filter(x=>x.id===id)[0] : null;\n    this.setState({routineForm: r\n      ? {...r, editing:id}\n      : {title:'', note:'', block:'morning', minutes:45, days:[0,1,2,3,4,5,6], editing:null}});\n  }\n  closeRoutineForm(){ this.setState({routineForm:null}); }\n  setRoutineField(field, value){\n    this.setState(st=>({routineForm:{...st.routineForm, [field]:value}}));\n  }\n  toggleRoutineDay(i){\n    this.setState(st=>{\n      const days=st.routineForm.days.slice();\n      const at=days.indexOf(i);\n      if(at>-1) days.splice(at,1); else days.push(i);\n      return {routineForm:{...st.routineForm, days}};\n    });\n  }\n  saveRoutine(){\n    const f=this.state.routineForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Name the routine first'); return; }\n    if(!f.days.length){ this.toast('Pick at least one day'); return; }\n    const body={title, note:String(f.note||'').trim(), block:f.block,\n      minutes:Math.max(5, Number(f.minutes)||45), days:f.days.slice().sort()};\n    this.setState(st=>({\n      routineForm:null,\n      routines: f.editing\n        ? st.routines.map(r=>r.id===f.editing?{...r, ...body}:r)\n        : [...st.routines, {...body, id:this.uid('r'), done:{}, order:st.routines.length+1}]\n    }));\n    this.toast(f.editing?'Routine updated':'Routine added');\n  }\n  deleteRoutine(id){\n    this.setState(st=>({routines:st.routines.filter(r=>r.id!==id)}));\n    this.toast('Routine removed');\n  }\n  toggleRoutine(id, date){\n    const d=date||todayISO();\n    this._pop[id]=Date.now();\n    th st=>({taskForm:{...st.taskForm, [field]:value}}));\n  }\n  saveTaskForm(){\n    const f=this.state.taskForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Give the task a name first'); return; }\n    const t={ id:this.uid('t'), title, note:String(f.note||'').trim(),\n      scope:f.scope, parent:f.parent||null,\n      goalId:f.goalId||'', priority:f.priority||'Med',\n      minutes:Math.max(5, Number(f.minutes)||45), done:false };\n\n    if(f.scope==='day'){\n      t.date = f.date || todayISO();\n      // a clock time pins the task to whichever session contains it\n      t.block = f.at ? this.blockFor(f.at) : (f.block||'morning');\n      if(f.at){ t.type='event'; t.at=f.at; }\n    }else{\n      t.targetDate = f.targetDate || '';\n      if(f.scope==='week') t.startDate = startOfWeek(t.targetDate||todayISO());\n    }\n    t.order=this.nextOrder(this.listKey(t));\n\n    // A month or a week is not finished when it is written down — it is\n    // finished when it has been split. Rather than dropping the user back on a\n    // list, the sheet advances straight into breaking this one down, which is\n    // the order the work actually happens in.\n    const nextScope = f.scope==='month' ? 'week' : f.scope==='week' ? 'day' : null;\n    const patch={ tasks:[...this.state.tasks, t], taskForm:null };\n    if(f.parent) patch.expanded={...this.state.expanded, [f.parent]:true};\n    if(nextScope){\n      patch.expanded={...(patch.expanded||this.state.expanded), [t.id]:true};\n      patch.taskForm={\n        scope:nextScope, parent:t.id, title:'', note:'', minutes:45,\n        block:'morning', at:'', priority:'Med', goalId:t.goalId||'',\n        targetDate: nextScope==='week' ? this.weekSlotFor(t, 0) : '',\n        date: nextScope==='day' ? this.dayInsideWeek(t) : '',\n        step:'details', chain:true, chainOf:t.title, chainIndex:1,\n      };\n    }\n    this.setState(patch);\n\n    if(nextScope){ this.toast(nextScope==='week'?'Now split it into weeks':'Now fill in the days'); return; }\n\n    if(!f.at){\n      const cap=this.state.capacity[t.block]||0;\n      const sameDay=this.state.tasks.filter(x=>x.scope==='day'&&x.block===t.block&&x.date===t.date&&!x.done);\n      const assigned=sameDay.reduce((a,x)=>a+x.minutes,0);\n      const label=(BLOCKS.filter(b=>b.key===t.block)[0]||{label:t.block}).label;\n      this.toast(cap>0 && assigned+t.minutes>cap\n        ? ('Added, but '+label+' is now '+(assigned+t.minutes-cap)+' minutes over')\n        : ('Added to '+label+' on '+prettyDate(t.date)));\n      return;\n    }\n    this.toast('Appointment added');\n  }\n  /* The end of the nth week from here, clamped to the month's own target.\n     Starts at the end of the current week, unless that has already arrived —\n     offering \"due today\" as the first weekly slot of a month-long plan is\n     worse than useless. */\n  weekSlotFor(monthTask, n){\n    const now=todayISO();\n    const end=monthTask.targetDate||addDays(now,30);\n    let first=addDays(startOfWeek(now), 6);\n    if(first<=now) first=addDays(first,7);\n    const slot=addDays(first, 7*n);\n    return slot>end ? end : slot;\n  }\n  /* \"Save and add another\" — keeps the sheet open on the same parent so a whole\n     week of days, or a month of weeks, goes in without reopening anything. */\n  saveAndNext(){\n    const f=this.state.taskForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Give it a name first'); return; }\n    const parent=f.parent, scope=f.scope, n=(f.chainIndex||1);\n    this.saveTaskForm();\n    // saveTaskForm has cleared or advanced the sheet; reopen it on the same\n    // parent, stepped on to the next week or the next day\n    const parentTask=this.state.tasks.filter(t=>t.id===parent)[0];\n    this.setState(st=>({taskForm:{\n      scope, parent, title:'', note:'', minutes:45,\n      block:'morning', at:'', priority:'Med',\n      goalId: parentTask?(parentTask.goalId||''):'',\n   this.toast('Goal added');\n  }\n  deleteGoal(id){\n    this.setState(st=>({goals:st.goals.filter(g=>g.id!==id),\n      tasks:st.tasks.map(t=>t.goalId===id?{...t, goalId:''}:t)}));\n    this.toast('Goal removed');\n  }\n\n  /* ——— revision: topic groups, cards, images ——— */\n  openGroupForm(){ this.setState({groupForm:{name:''}}); }\n  closeGroupForm(){ this.setState({groupForm:null}); }\n  setGroupField(v){ this.setState(st=>({groupForm:{...st.groupForm, name:v}})); }\n  saveGroup(){\n    const f=this.state.groupForm; if(!f) return;\n    const name=String(f.name||'').trim();\n    if(!name){ this.toast('Name the topic group first'); return; }\n    const g={id:this.uid('grp'), name};\n    this.setState(st=>({groups:[...st.groups, g], groupForm:null, expanded:{...st.expanded,[g.id]:true}}));\n    this.toast('Topic group added');\n  }\n  deleteGroup(id){\n    this.state.cards.filter(c=>c.groupId===id).forEach(c=>this.storeImage(c.id, null));\n    this.setState(st=>({groups:st.groups.filter(g=>g.id!==id),\n      cards:st.cards.filter(c=>c.groupId!==id)}));\n    this.toast('Group and its cards removed');\n  }\n  addCard(groupId, heading){\n    const c={id:this.uid('c'), groupId, heading:heading||'Untitled', note:'',\n      strength:0, step:0, dueIn:0};\n    this.setState(st=>({cards:[...st.cards, c]}));\n    return c.id;\n  }\n  deleteCard(id){\n    this.storeImage(id, null);\n    this.setState(st=>({cards:st.cards.filter(c=>c.id!==id)}));\n    this.toast('Card removed');\n  }\n\n  /* ——— the cropper ———\n     A file lands here as an object URL, is shown at whatever scale fits, and\n     the user pans and pinches it under a fixed square frame. Only the framed\n     region is drawn to a canvas on save, so what gets stored is the crop the\n     user actually chose rather than the whole photo plus a viewport. */\n  pickImage(groupId, cardId, ev){\n    const file=ev.target.files && ev.target.files[0];\n    ev.target.value='';\n    if(!file) return;\n    if(!/^image\\//.tes .min(100, c.strength + (got?12:-15)))};\n      });\n      const q=st.recallQueue||[];\n      if(q.length) return {cards, recall:q[0], recallQueue:q.slice(1), recallStage:'prompt'};\n      return {cards, recall:null, recallQueue:null, recallStage:'prompt'};\n    });\n  }\n  dueCard(){\n    const due=this.state.cards.filter(c=>c.dueIn<=0);\n    return due.length ? due.sort((a,b)=>a.strength-b.strength)[0] : null;\n  }\n  toggleRevision(){\n    this.setState(st=>({revisionOn:!st.revisionOn}), ()=>{\n      if(this.state.revisionOn){ this.schedule(this.state.freqMin*60000); this.toast('Revision mode on'); }\n      else { clearTimeout(this._rt); this.toast('Revision mode off'); }\n    });\n  }\n  /* Any interval from 5 minutes to 12 hours, not a fixed menu — how often a\n     recall is welcome depends entirely on the day. */\n  setFreq(m){\n    const v=Math.max(5, Math.min(720, Math.round(Number(m)||0)));\n    if(!v) return;\n    this.setState({freqMin:v}, ()=>{ this.schedule(v*60000); this.toast('Recall every '+freqWords(v)); });\n  }\n  setFreqField(v){\n    const n=Math.round(Number(v)||0);\n    this.setState({freqMin:n});                       // let the field be typed in\n    clearTimeout(this._fq);\n    this._fq=setTimeout(()=>{ if(this._alive) this.setFreq(n); }, 700);\n  }\n  setCap(v){\n    const n=Math.max(1, Math.min(50, Math.round(Number(v)||0)));\n    this.setState({dailyCap:n}, ()=>this.toast('At most '+n+' a day'));\n  }\n  setRecallWindow(edge, v){\n    if(!v) return;\n    this.setState({[edge==='from'?'recallFrom':'recallTo']:v});\n  }\n  /* Outside the window the timer keeps ticking but nothing pops. A window that\n     wraps past midnight (21:00 → 07:00) is read as the two ends of the day. */\n  inRecallWindow(){\n    const s=this.state, a=mins(s.recallFrom||'00:00'), b=mins(s.recallTo||'23:59');\n    if(a===b) return true;                            // same time both ends = always\n    const n=this.nowMin();\n    return a<b ? (n>=a && n<b) : (n>=a || n<b);\n  }\n  schedule(ms){\n    clearTimeout(this._rt);\n    if(!this.state.revisionOn) return;\n    this._rt=setTimeout(()=>{\n      if(!this._alive || !this.state.revisionOn) return;\n      const s=this.state;\n      const blocked = s.recall || s.review || s.crop || this._dragging\n        || (s.timer&&s.timer.running) || s.recallsToday>=s.dailyCap\n        || !this.inRecallWindow() || this.inAppointment();\n      if(!blocked){\n        const card=this.dueCard();\n        if(card){\n          if(document.hidden) this.notify('Recall: '+card.heading, 'Tap to check yourself on this one.');\n          this.openRecall(card.id);\n        }\n      }\n      this.schedule(this.state.freqMin*60000);\n    }, ms);\n  }\n\n  /* ——— capacity ——— */\n  setHours(block, edge, value){\n    this.setState(st=>{\n      const hours={...st.hours, [block]:{...st.hours[block], [edge]:value}};\n      return {hours, capacity:capacityFrom(hours)};\n    });\n  }\n  toggleOffice(d){ this.setState(st=>({office:{...st.office,[d]:!st.office[d]}})); }\n  toggleTheme(){ this.setState(st=>({theme:st.theme==='light'?'dark':'light'})); }\n\n  /* ——— timer ——— */\n  startTimer(id){\n    const t=this.state.tasks.filter(x=>String(x.id)===String(id))[0]; if(!t) return;\n    this.setState({timer:{id, title:t.title, total:t.minutes*60, left:t.minutes*60, spent:0, running:true}});\n  }\n  timerPause(){ this.setState(st=>({timer:{...st.timer, running:!st.timer.running}})); }\n  timerDone(){\n    const t=this.state.timer; if(!t) return;\n    const m=Math.max(1,Math.round(t.spent/60)), est=Math.round(t.total/60);\n    this.setState(st=>({timer:null, tasks:st.tasks.map(x=>String(x.id)===String(t.id)?{...x,done:true,actual:m}:x)}));\n    this.toast(m>est*1.2 ? ('Took '+m+' minutes against '+est+' planned')\n                         : ('Done in '+m+' minutes. You planned '+est+'.'));\n  }\n\n  /* ——— backlog ——— */\n  backlogToToday(id){\n    const item=this.state.backlog.filter(b=>b.id===id)[0]; if(!item) return;
