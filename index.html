&& t.type!=='event');\n    this.setState(st=>{\n      const carried=moving.map(t=>({id:this.uid('b'), title:t.title, from:'today',\n        minutes:t.minutes, reason:rv.reasons[t.id]||null, goalId:t.goalId||''}));\n      const kept=st.tasks.filter(t=>rv.ids.indexOf(t.id)===-1);\n      const now=todayISO();\n      const onToday=st.tasks.filter(t=>t.scope==='day' && (t.date||now)===now);\n      const history={...st.history, [now]:{\n        planned:onToday.reduce((a,t)=>a+t.minutes,0),\n        done:onToday.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0),\n        total:onToday.length, finished:onToday.filter(t=>t.done).length,\n      }};\n      const hold=anyDone||useFreeze;\n      return {\n        review:null, tasks:kept, history,\n        backlog: where==='weekend' ? st.backlog : [...st.backlog, ...carried],\n        streak: hold ? st.streak+1 : 0,\n        streakBest: Math.max(st.streakBest, hold?st.streak+1:0),\n        freezes: useFreeze ? Math.max(0, st.freezes-1) : st.freezes,\n      };\n    });\n    this.toast(where==='weekend' ? 'Batched onto the weekend' : 'Carried to tomorrow');\n  }\n\n  /* ——— notifications ———\n     `new Notification(...)` is forbidden outright on Android Chrome — it\n     throws \"Illegal constructor. Use ServiceWorkerRegistration.showNotification\n     instead\" — which is why the permission could be granted, the switch on,\n     and every alert still fail. The service worker is registered anyway, so\n     go through it and keep the constructor as the desktop fallback. */\n  notify(title, body){\n    if(!this.state.notifyOn) return Promise.resolve(false);\n    if(!window.Notification || Notification.permission!=='granted') return Promise.resolve(false);\n    const opts={body, tag:'climbup', icon:'icon-192.png', badge:'icon-192.png'};\n    const direct=()=>{ try{ new Notification(title, opts); return true; }catch(e){ return false; } };\n    if(navigator.serviceWorker && navigator.serviceWorker.ready){\n      return navigator.serviceWorker.ready\n        .then(reg=>reg.showNotification(title, opts))\n        .then(()=>true)\n        .catch(()=>direct());\n    }\n    return Promise.resolve(direct());\n  }\n  toggleNotify(){\n    if(!window.Notification){ this.toast('This browser has no notification support'); return; }\n    if(this.state.notifyOn){ this.setState({notifyOn:false}); this.toast('Notifications off'); return; }\n    if(Notification.permission==='granted'){ this.setState({notifyOn:true}); this.toast('Notifications on'); return; }\n    if(Notification.permission==='denied'){ this.setState({notifPerm:'denied'}); this.toast('Blocked — allow notifications in your browser settings'); return; }\n    Notification.requestPermission().then(p=>{\n      if(!this._alive) return;\n      this.setState({notifPerm:p, notifyOn:p==='granted'});\n      this.toast(p==='granted'?'Notifications on':'Permission not granted');\n    });\n  }\n  testNotify(){\n    if(!this.state.notifyOn){ this.toast('Turn notifications on first'); return; }\n    this.notify('ClimbUp','This is what a scheduled alert looks like.')\n      .then(ok=>{ if(this._alive) this.toast(ok\n        ? 'Sent — check your notifications'\n        : 'Your browser refused it. On a phone, install ClimbUp first.'); });\n  }\n  setReminder(e){ this.setState({reminderTime:e.target.value}); this.toast('Reminder set for '+e.target.value); }\n  checkReminder(n){\n    const hhmm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');\n    if(hhmm===this.state.reminderTime && this._lastReminder!==hhmm){\n      this._lastReminder=hhmm;\n      this.notify('Today’s plan is ready','Morning block: '+this.state.capacity.morning+' minutes.');\n    }\n  }\n  inAppointment(){\n    const m=this.nowMin();\n    return this.state.tasks.some(t=>{\n      if(t.type!=='event'||!t.at) return false;\n      const s=mins(t.at);\n      return m>=s && m<s+(t.minutes||30);\n    });\n  }\n  nowMin(){ const n=this.state.now; return n.getHours()*60+n.getMinutes(); }\n  toast(msg){ this.setState({toast:msg}); clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:null}),2800); }\n  go(s){ this.setState(st=>({screen:s, dayOffset: s==='today'?st.dayOffset:0})); }\n  setPlanScope(s){ this.setState({planScope:s}); }\n  /* Today is a window on one date, not only on this one — you should be able\n     to look ahead at tomorrow without planning it from memory. Ten weeks each\n     way is far past anything worth scrolling to. */\n  shiftDay(n){ this.setState(st=>({dayOffset:Math.max(-70, Math.min(70, st.dayOffset+n))})); }\n  resetDay(){ this.setState({dayOffset:0}); }\n\n  /* ——— the back button ———\n     Screens are state, not URLs, so a browser back press would otherwise walk\n     straight out of the app. One sentinel history entry is kept in front of\n     the one the app loaded on: back pops the sentinel, the handler pushes it\n     back so the page never actually leaves, and the press is spent unwinding\n     the UI instead — deepest overlay first, then any screen back to the\n     dashboard, and only from the dashboard does it ask about leaving. */\n  setupBack(){\n    this._onPop=()=>{\n      if(this._leaving) return;           // the one press we agreed to let out\n      // Nothing to guard behind the sign-in gate, and the gate would cover the\n      // dialog anyway — back there should just be back.\n      if(this.state.authState!=='signedIn') return;\n      try{ history.pushState({cu:'app'}, ''); }catch(e){}\n      this.handleBack();\n    };\n    window.addEventListener('popstate', this._onPop);\n  }\n  /* The sentinel is laid down on the way in, not on mount: put down earlier it\n     would swallow the first back press on the sign-in screen, where back ought\n     to just be back. */\n  armBack(){\n    if(this._backArmed) return;\n    this._backArmed=true;\n    try{ history.replaceState({cu:'root'}, ''); history.pushState({cu:'app'}, ''); }catch(e){}\n  }\n  /* Armed only once there is something to lose — warning on the sign-in screen\n     would be noise, and it covers closing the tab outright, not just back. */\n  armUnloadWarning(on){\n    if(on && !this._onUnload){\n      this._onUnload=e=>{ if(this._leaving) return; e.preventDefault(); e.returnValue=''; return ''; };\n      window.addEventListener('beforeunload', this._onUnload);\n    }else if(!on && this._onUnload){\n      window.removeEventListener('beforeunload', this._onUnload);\n      this._onUnload=null;\n    }\n  }\n  handleBack(){\n    const s=this.state;\n    if(s.confirmExit){ this.setState({confirmExit:false}); return; }   // second press = stay\n    if(s.installHelp){ this.closeInstallHelp(); return; }\n    if(s.crop){ this.cancelCrop(); return; }\n    if(s.recall){ this.closeRecall(undefined); return; }\n    if(s.review){ this.reviewClose(); return; }\n    if(s.taskForm){ this.closeTaskForm(); return; }\n    if(s.routineForm){ this.closeRoutineForm(); return; }\n    if(s.groupForm){ this.closeGroupForm(); return; }\n    if(s.confirmErase){ this.setState({confirmErase:false}); return; }\n    if(s.screen!=='dash'){ this.go('dash'); return; }\n    this.setState({confirmExit:true});\n  }\n  stayHere(){ this.setState({confirmExit:false}); }\n  leaveApp(){\n    this.setState({confirmExit:false});\n    this._leaving=true;\n    this.armUnloadWarning(false);\n    // -2 clears the sentinel and the entry the app loaded on, landing on\n    // whatever came before it. A tab opened straight onto ClimbUp has nothing\n    // before it, so nothing moves — try to close it, and if the browser\n    // refuses, hand control back rather than leaving the guard disarmed.\n    try{ history.go(-2); }catch(e){}\n    setTimeout(()=>{\n      if(!this._alive) return;\n      try{ window.close(); }catch(e){}\n      this._leaving=false;\n      this.armUnloadWarning(!!this.state.authUser);\n      try{ history.pushState({cu:'app'}, ''); }catch(e){}\n      this.toast('Close this tab from the browser to leave');\n    }, 700);\n  }\n\n  renderVals(){\n    const s=this.state;\n    const fmt=hhmm=>{ const p=String(hhmm||'0:0').split(':').map(Number);\n      const ap=p[0]<12?'am':'pm', hh=p[0]%12===0?12:p[0]%12;\n      return hh+(p[1]?':'+String(p[1]).padStart(2,'0'):'')+' '+ap; };\n    const hm=m=>{ const h=Math.floor(m/60), r=m%60; return (h?h+'h ':'')+(r?r+'m':(h?'':'0m')); };\n    const pct=(a,b)=>b>0?Math.round(a/b*100):0;\n    const goalName=id=>{ const g=s.goals.filter(x=>x.id===id)[0]; return g?g.title:''; };\n\n    /* ── one row builder for every scope ───────────────────────────────── */\n    const kids=id=>s.tasks.filter(t=>t.parent===id);\n    const descMinutes=id=>{\n      let total=0;\n      const walk=pid=>s.tasks.filter(t=>t.parent===pid).forEach(c=>{\n        if(c.scope==='day') total+=c.minutes; else walk(c.id);\n      });\n      walk(id); return total;\n    };\n    const badge=(t,isFirst)=>{\n      if(t.done) return {label:'Done', tag:'tag-neutral'};\n      if(t.type==='event') return {label:fmt(t.at)+' fixed', tag:'tag-accent-2'};\n      if(isFirst) return {label:'Do first', tag:'tag-accent'};\n      if(t.priority==='High') return {label:'Must do', tag:'tag-accent-2'};\n      if(t.priority==='Low') return {label:'Skip if short', tag:'tag-neutral'};\n      return {label:'If time', tag:'tag-outline'};\n    };\n    const mkRow=(t,isFirst,list)=>{\n      const b=badge(t,isFirst);\n      const ch=kids(t.id), chDone=ch.filter(x=>x.done).length;\n      const bits=[];\n      if(t.goalId && goalName(t.goalId)) bits.push(goalName(t.goalId));\n      if(t.scope==='day'){\n        // on Today the date is the screen; in Plan's Day list it is the point\n        if(list==='day' && t.date) bits.push(prettyDate(t.date));\n        bits.push(t.minutes+' min');\n        if(t.actual) bits.push('took '+t.actual);\n      }else if(t.targetDate){\n        bits.push('by '+prettyDate(t.targetDate));\n      }\n      if(t.scope!=='day'){\n        // minutes are a property of the day, not of a month — a monthly target\n        // is worth however long the daily work under it adds up to\n        const roll=descMinutes(t.id);\n        if(roll) bits.push(hm(roll)+' planned below');\n      }\n      const sc=SCOPES.filter(x=>x.key===t.scope)[0]||SCOPES[2];\n      // only a live, unfixed row can be dragged: a finished one sorts to the\n      // bottom and an appointment is pinned to its clock time, so dragging\n      // either would just snap back and read as a broken gesture\n      const movable=!t.done && t.type!=='event';\n      const left = t.targetDate ? daysBetween(today, t.targetDate) : null;\n      return {\n        id:String(t.id), list, drag:movable?'1':'0',\n        title:t.title, meta:bits.join(' · '), carried:!!t.carried,\n        note:t.note||'', hasNote:!!(t.note||''),\n        dateText: t.scope==='day' && t.date && t.date!==today ? prettyDate(t.date) : '',\n        due: left==null?'' : left<0?('overdue by '+(-left)+'d') : left===0?'due today' : (left+'d left'),\n        dueColor: left==null?'inherit' : left<0?'var(--color-accent-2-800)' : left<=2?'var(--color-accent-2-800)':'var(--color-accent-700)',\n        hasDue: left!=null,\n        sessionLabel:b.label, sessionTag:b.tag,\n        dotBg:t.done?'var(--color-accent)':'transparent',\n        dotBorder:t.done?'var(--color-accent)':'var(--color-neutral-400)',\n        checkOpacity:t.done?1:0, textOpacity:t.done?0.5:1,\n        strike:t.done?'line-through':'none',\n        anim:(Date.now()-(this._pop[t.id]||0)<600)?'pop .45s ease':'none',\n        toggle:()=>this.toggle(t.id),\n        remove:()=>this.deleteTask(t.id),\n        canFocus:!t.done && t.type!=='event' && !s.timer && t.scope==='day',\n        focus:()=>this.startTimer(t.id),\n        canBreak:!!sc.child,\n        breakLabel:sc.child?('Break into '+sc.childLabel):'',\n        breakDown:()=>this.openTaskForm(sc.child, t.id),\n        hasKids:ch.length>0,\n        kidSummary: ch.length? (chDone+' of '+ch.length+' '+sc.childLabel+' done') : r(t=>t.block===d.key);\n      const ordered=inBlock.slice().sort(rank);\n      let first=false;\n      const tasks=ordered.map(t=>{\n        const isFirst=!t.done && t.type!=='event' && !first;\n        if(isFirst) first=true;\n        return mkRow(t, isFirst, 'day:'+d.key);\n      });\n      // routines occupy the session too — the capacity bar has to know\n      const rs=routinesToday.filter(r=>r.block===d.key).map(r=>({\n        id:r.id, title:r.title, note:r.note||'', minutes:r.minutes,\n        done:!!(r.done||{})[viewDate],\n        dotBg:(r.done||{})[viewDate]?'var(--color-accent)':'transparent',\n        dotBorder:(r.done||{})[viewDate]?'var(--color-accent)':'var(--color-neutral-400)',\n        checkOpacity:(r.done||{})[viewDate]?1:0,\n        textOpacity:(r.done||{})[viewDate]?0.5:1,\n        strike:(r.done||{})[viewDate]?'line-through':'none',\n        anim:(Date.now()-(this._pop[r.id]||0)<600)?'pop .45s ease':'none',\n        hasNote:!!(r.note||''),\n        toggle:()=>this.toggleRoutine(r.id, viewDate),\n      }));\n      const capacity=s.capacity[d.key]||0;\n      const assigned=inBlock.filter(t=>!t.done).reduce((a,t)=>a+t.minutes,0)\n        + rs.filter(r=>!r.done).reduce((a,r)=>a+r.minutes,0);\n      const over=capacity>0 && assigned>capacity;\n      const h=s.hours[d.key]||{from:'',to:''};\n      return {key:d.key, label:d.label, time:fmt(h.from)+' – '+fmt(h.to),\n        routines:rs, hasRoutines:rs.length>0,\n        tasks, capacity, assigned, over, overBy:Math.max(0,assigned-capacity),\n        fillPct: capacity>0?Math.min(100,Math.round(assigned/capacity*100)):0,\n        fillColor: over?'var(--color-accent-2)':'var(--color-accent)',\n        numeralColor: over?'var(--color-accent-2-800)':'var(--color-accent-700)',\n      };\n    }).filter(b=>b.tasks.length || b.routines.length);\n\n    const routinesReal=s.dayOffset ? this.routinesFor(today) : routinesToday;\n    const rDone=routinesReal.filter(r=>(r.done||{})[today]).length;\n    const dayTotal=  bg: isToday?'var(--color-accent)': tgt?'var(--color-accent-2-100)':'transparent',\n        fg: isToday?'var(--color-bg)': tgt?'var(--color-accent-2-800)':'var(--color-text)',\n        weight: isToday||tgt?700:400,\n        ring: rec && rec.total && rec.finished===rec.total ? 'var(--color-accent)':'transparent',\n        dot: tgt?'var(--color-accent-2)': work?'var(--color-accent-400)':'transparent',\n      });\n    }\n    const monthLabel=MONTHS[cur.getMonth()]+' '+cur.getFullYear();\n\n    /* Progress at all three zooms, each over its own real window. */\n    const period=(fromDate)=>{\n      const inWin=s.tasks.filter(t=>t.scope==='day' && t.date && t.date>=fromDate && t.date<=today);\n      const hist=Object.keys(s.history).filter(d=>d>=fromDate && d<=today).map(d=>s.history[d]);\n      const total=inWin.length + hist.reduce((a,h)=>a+(h.total||0),0);\n      const done=inWin.filter(t=>t.done).length + hist.reduce((a,h)=>a+(h.finished||0),0);\n      const mins=inWin.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0)\n        + hist.reduce((a,h)=>a+(h.done||0),0);\n      return {total, done, pct:pct(done,total), hours:(mins/60).toFixed(1)};\n    };\n    const pDay=period(today);\n    const pWeek=period(startOfWeek(today));\n    const pMonth=period(monthStart);\n    const targetsSoon=s.tasks.filter(t=>t.targetDate && !t.done && daysBetween(today,t.targetDate)<=14)\n      .sort((a,b)=>String(a.targetDate).localeCompare(String(b.targetDate)))\n      .slice(0,4).map(t=>{\n        const left=daysBetween(today,t.targetDate);\n        return {title:t.title, when:prettyDate(t.targetDate),\n          scopeLabel:(SCOPES.filter(x=>x.key===t.scope)[0]||{label:''}).label,\n          left: left<0?('overdue '+(-left)+'d'): left===0?'today':(left+'d'),\n          color: left<=2?'var(--color-accent-2-800)':'var(--color-accent-700)'};\n      });\n\n    /* The week strip is derived, not stored: past days come out of history,\n       today and anything scheduled ahead out of the live task list. */\n    const weekStart=startOfWeek(today);\n    const dayStats=DAYS.map((label,i)=>{\n      const ds=addDays(weekStart,i);\n      const rec=s.history[ds];\n      if(rec && ds<today) return {d:label, ds, planned:rec.planned||0, done:rec.done||0};\n      const on=s.tasks.filter(t=>t.scope==='day' && (t.date||today)===ds);\n      return {d:label, ds,\n        planned:on.reduce((a,t)=>a+t.minutes,0),\n        done:on.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0)};\n    });\n    const wPlanned=dayStats.reduce((a,w)=>a+w.planned,0);\n    const wDone=dayStats.reduce((a,w)=>a+w.done,0);\n    const maxLoad=Math.max.apply(null, dayStats.map(w=>Math.max(w.planned,w.done)).concat([1]));\n    const week=dayStats.map(w=>({\n      d:w.d,\n      plannedH:Math.round(w.planned/maxLoad*94), doneH:Math.round(w.done/maxLoad*94),\n      doneColor: w.done>=w.planned&&w.done>0?'var(--color-accent)':w.done>0?'var(--color-accent-400)':'transparent',\n      weight: w.ds===today?700:400,\n      labelColor: w.ds===today?'var(--color-accent)': s.office[w.d]?'var(--color-text)':'var(--color-accent-2)',\n    }));\n\n    // where the day actually goes, session by session — this is the \"what to\n    // improve\" signal that does not need any data the user has not entered\n    const blockStats=BLOCKS.map(b=>{\n      const inB=dayTasks.filter(t=>t.block===b.key);\n      const d=inB.filter(t=>t.done).length;\n      const cap=s.capacity[b.key]||0;\n      const load=inB.filter(t=>!t.done).reduce((a,t)=>a+t.minutes,0);\n      return {key:b.key, label:b.label, total:inB.length, done:d,\n        pct:pct(d,inB.length), cap, load,\n        barPct: cap>0?Math.min(100,Math.round(load/cap*100)):0,\n        color: cap>0&&load>cap?'var(--color-accent-2)':'var(--color-accent)',\n        note: inB.length===0 ? 'nothing planned'\n            : cap>0&&load>cap ? (load-cap)+' min over'\n            : d===inB.length ? 'all clear' : (inB.length-d)+' left'};\n    });\n\n    const reasonCounts=REASONS.map(r=>{\n      const c=s.backlog.filter(b=>b.reason===r).length;\n      return {label:r, count:c, color:c?'var(--color-accent)':'var(--color-neutral-400)'};\n    });\n    const topReason=reasonCounts.slice().sort((a,b)=>b.count-a.count)[0];\n\n    const weakCards=s.cards.slice().sort((a,b)=>a.strength-b.strength).slice(0,3)\n      .map(c=>({heading:c.heading, strength:c.strength,\n        group:(s.groups.filter(g=>g.id===c.groupId)[0]||{name:''}).name,\n        color: c.strength>=70?'var(--color-accent)':c.strength>=40?'var(--color-accent-400)':'var(--color-accent-2)'}));\n\n    // Advice, in priority order, and only ever from data that exists.\n    const advice=[];\n    const overBlock=blockStats.filter(b=>b.cap>0 && b.load>b.cap)[0];\n    if(!s.tasks.length) advice.push('Nothing planned yet. Start with a monthly target, then break it down.');\n    if(overBlock) advice.push(overBlock.label+' is '+(overBlock.load-overBlock.cap)+' minutes over what you have. Move something.');\n    if(s.backlog.length>=3) advice.push(s.backlog.length+' items are carrying. Clear or drop them before adding more.');\n    if(topReason && topReason.count>=2) advice.push('\"'+topReason.label+'\" is your commonest reason for slipping. Plan around it.');\n    if(weakCards.length && weakCards[0].strength<40) advice.push(weakCards[0].heading+' is your weakest card. Revise it today.');\n    if(!advice.length && dayTotal) advice.push('Nothing is off track. Keep the run going.');\n\n    const backlogMins=s.backlog.reduce((a,b)=>a+b.minutes,0);\n    const eveningCap=s.capacity.evening||1;\n    const backlog=s.backlog.map(b=>({\n      title:b.title, minutes:b.minutes, from:b.from,\n      reasonText: b.reason? ' · '+b.reason.toLowerCase() : '',\n      toToday:()=>this.backlogToToday(b.id),\n      toWeekend:()=>this.backlogToWeekend(b.id),\n      drop:()=>this.backlogDrop(b.id),\n    }));\n\n    /* ── GOALS ────────────────────────────────────────────────────────── */\n    const goals=s.
